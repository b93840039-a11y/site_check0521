<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工地回報單自動化系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    function App() {
      const [formData, setFormData] = useState({
        projectName: '', licenseNumber: '', estimatedCompletionDate: ''
      });

      // 核心邏輯：雙引擎智慧爬蟲
      const processIntelligentSearch = async (aiResult) => {
        const targetUrls = [
          'https://www.leju.com.tw/community/L2b71492225a482', // 範例網址
          'https://newhouse.591.com.tw/137368'
        ];

        for (const url of targetUrls) {
          try {
            // 使用跨域代理獲取網頁內容
            const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
            const data = await response.json();
            const content = data.contents;

            // 搜尋條件：使用執照字號比對 (最精準)
            if (content.includes(aiResult.licenseNumber) || content.includes(aiResult.projectName)) {
              // 提取日期：尋找 "完工" 關鍵字後的日期
              const dateMatch = content.match(/(?:預計完工|預計交屋)(?:時間|日期|年月)?[：:\s]*?(\d{3,4}年\d{1,2}月)/);
              const nameMatch = content.match(/<title>(.*?)<\/title>/); // 從標題獲取正確案名

              return {
                estimatedDate: dateMatch ? dateMatch[1] : '待查',
                officialName: nameMatch ? nameMatch[1].split('-')[0].trim() : aiResult.projectName
              };
            }
          } catch (e) { console.error("爬取失敗", e); }
        }
        return null;
      };

      // 當您執行辨識後，會觸發上述函式並更新狀態
      const updateFormWithScrapedData = async (aiResult) => {
        const result = await processIntelligentSearch(aiResult);
        if (result) {
            setFormData(prev => ({
                ...prev,
                projectName: result.officialName, // 同步更換成正確案名
                estimatedCompletionDate: result.estimatedDate
            }));
        }
      };

      return (
        <div className="p-8">
            <h1 className="text-2xl font-bold mb-4">工地回報單自動化系統 (已啟用名稱同步)</h1>
            {/* 您的 UI 欄位 */}
            <div className="grid grid-cols-2 gap-4">
                <input value={formData.projectName} className="border p-2" placeholder="案名(自動更新)" readOnly />
                <input value={formData.estimatedCompletionDate} className="border p-2" placeholder="預計完工日(自動更新)" readOnly />
            </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
